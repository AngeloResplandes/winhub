name: Documentation

# Builds the documentation book (English at the site root, Brazilian Portuguese under /pt-BR/) on pull requests,
# and publishes it to GitHub Pages from main.
on:
  push:
    branches: [main]
    paths: ["docs/**", "book/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "book/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: mdBook
        run: cargo install mdbook --version 0.4.52 --locked
      - name: Build both books
        run: |
          mdbook build book/en
          mdbook build book/pt-BR
          test -f site/index.html && test -f site/pt-BR/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
