name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Versão do Swift
        run: swift --version
      - name: Compilar
        run: swift build
      - name: Testes
        # Os testes com o Wine real (RUN_WINE_TESTS=1) não rodam no CI.
        run: swift test
      - name: Instalar mingw-w64 (compila o wrapper da Steam)
        run: brew install mingw-w64
      - name: Empacotar (assinatura ad-hoc)
        run: ./scripts/package-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WinHub-${{ github.sha }}
          path: dist/WinHub.zip
