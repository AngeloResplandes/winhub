name: Release

# Publica uma release a cada push na main (o app instalado a encontra e se atualiza sozinho).
# A versão é "<arquivo VERSION>.<número da execução>", por exemplo 0.2.57; para mudar major/minor,
# edite o arquivo VERSION.
# Sem os segredos abaixo, o app sai com assinatura ad-hoc (na primeira abertura: Ajustes do Sistema →
# Privacidade e Segurança → Abrir Mesmo Assim).
#
# Segredos opcionais para assinar e notarizar com o seu Apple Developer ID:
#   DEVELOPER_ID_P12_BASE64   certificado "Developer ID Application" exportado (.p12) em base64
#   DEVELOPER_ID_P12_PASSWORD senha do .p12
#   DEVELOPER_ID              ex.: "Developer ID Application: Seu Nome (TEAMID)"
#   NOTARY_KEY_BASE64         chave da API do App Store Connect (.p8) em base64
#   NOTARY_KEY_ID, NOTARY_ISSUER_ID

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

# Uma release de cada vez, na ordem dos pushes.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION).${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Testes
        run: swift test

      - name: Importar certificado
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Configurar notarização
        if: env.HAS_NOTARY == 'true'
        env:
          KEY: ${{ secrets.NOTARY_KEY_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials winhub-notary --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER"
          echo "NOTARY_PROFILE=winhub-notary" >> "$GITHUB_ENV"

      - name: Instalar mingw-w64 (compila o wrapper da Steam)
        run: brew install mingw-w64

      - name: Empacotar
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          BUILD: ${{ github.run_number }}
        run: |
          [ "$HAS_SIGNING" = "true" ] || unset DEVELOPER_ID
          ./scripts/package-app.sh

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag criada com o GITHUB_TOKEN não dispara outros workflows.
        run: |
          gh release create "v$VERSION" dist/WinHub.zip --target "$GITHUB_SHA" \
            --title "WinHub $VERSION" --generate-notes --latest
