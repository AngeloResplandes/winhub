[book]
authors = ["WinHub contributors"]
language = "pt-BR"
src = "../../docs/pt-BR"
title = "Documentação do WinHub"

[build]
build-dir = "../../site/pt-BR"
create-missing = false

[output.html]
git-repository-icon = "fa-github"
git-repository-url = "https://github.com/AngeloResplandes/winhub"
edit-url-template = "https://github.com/AngeloResplandes/winhub/edit/main/docs/pt-BR/{path}"
preferred-dark-theme = "navy"
smart-punctuation = true

[output.html.search]
enable = true
limit-results = 30
boost-title = 2
